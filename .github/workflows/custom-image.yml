name: Build Custom Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Additional image tag
        required: true
        default: improved
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/davixk/decypharr

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Run Go tests
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify generated JavaScript
        run: |
          npm ci
          npm run minify-js
          git diff --exit-code -- pkg/server/assets/build/js

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Decypharr with Davixk reliability and provider fixes

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ inputs.tag }}
            CHANNEL=custom
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=custom-image
          cache-to: type=gha,scope=custom-image,mode=max
          provenance: mode=max
          sbom: true
